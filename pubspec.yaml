name: eldercare_ai
description: "ElderCare AI - Smart elder care companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.0
  shared_preferences: ^2.2.0
  intl: ^0.19.0

  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9+2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  image_picker: ^1.2.1
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.0.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  another_telephony: ^0.4.0
  sensors_plus: ^6.1.1
  pedometer: ^4.0.2
  health: ^11.1.0
  vibration: ^2.0.0
  just_audio: ^0.9.40
  path_provider: ^2.1.0
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^7.0.0
  crypto: ^3.0.3
  heart_bpm: ^2.0.0+0
  webview_flutter: ^4.13.1
  geocoding: ^4.0.0
  app_usage: ^4.1.0
  installed_apps: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/Logo.png
    - assets/images/animated_palm.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/Logo.png"